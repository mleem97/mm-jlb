name: Agent repository export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/repository.tgz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: /tmp/repository.tgz
          retention-days: 1
