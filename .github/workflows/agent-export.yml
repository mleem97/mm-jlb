name: Agent repository export

on:
  push:
    branches:
      - agent/fix-react-review-audit

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: tar --exclude=.git -czf repository.tgz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: repository.tgz
          retention-days: 1
