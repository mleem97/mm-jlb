name: Apply static-analysis fixes

on:
  push:
    branches:
      - fix/static-analysis-findings
    paths:
      - .github/workflows/apply-static-fixes.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  remediate:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/static-analysis-findings
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Apply code remediations
        run: |
          python tools/fix_static_findings.py
          python tools/fix_static_findings_followup.py

      - name: Update lockfile and install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply ESLint auto-fixes
        id: lint
        continue-on-error: true
        run: pnpm exec eslint . --fix

      - name: Type-check
        id: types
        continue-on-error: true
        run: pnpm check-types

      - name: Run unit tests
        id: unit
        continue-on-error: true
        run: pnpm test:unit

      - name: Build application
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Remove temporary remediation tooling
        run: |
          rm -f tools/fix_static_findings.py
          rm -f tools/fix_static_findings_followup.py
          rm -f .github/workflows/apply-static-fixes.yml

      - name: Commit remediations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes generated"
            exit 1
          fi
          git commit -m "fix: resolve security and React review findings"
          git push origin HEAD:fix/static-analysis-findings

      - name: Report validation failures
        if: always()
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          echo "types=${{ steps.types.outcome }}"
          echo "unit=${{ steps.unit.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.types.outcome }}" = "success"
          test "${{ steps.unit.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
